<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>找回密码 | AI 群聊记忆系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="light-page">
  <main class="login-shell">
    <div class="auth-layout">
      <section class="auth-showcase" aria-label="账户安全">
        <div class="auth-stars" aria-hidden="true"></div>
        <div class="auth-nebula" aria-hidden="true"></div>
        <div class="auth-showcase-content">
          <a class="showcase-brand" href="/" aria-label="返回首页"><span class="showcase-mark" aria-hidden="true">N</span>NOVA WORKSPACE</a>
          <div class="showcase-copy">
            <p class="login-kicker">账户安全</p>
            <h2>安全找回你的<br>协作空间。</h2>
            <p>我们会向已注册邮箱发送一次性验证码，帮助你安全重设密码。</p>
          </div>
        </div>
      </section>
      <section class="login-card" aria-labelledby="forgot-password-title">
        <div class="login-brand" aria-label="AI 群聊记忆系统"><span class="brand-mark" aria-hidden="true">AI</span><span>AI 群聊记忆系统</span></div>
        <header>
          <p class="login-kicker">密码找回</p>
          <h1 id="forgot-password-title">获取验证码</h1>
          <p class="login-copy">输入邮箱后，我们会发送重设密码所需的验证码。</p>
        </header>
        {% if error %}<p class="login-alert" role="alert">{{ error }}</p>{% endif %}
        {% if message %}<p class="login-notice" role="alert">{{ message }}</p>{% endif %}
        <form class="login-form" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="form-field">
            <label for="email">邮箱</label>
            <input id="email" type="email" name="email" autocomplete="email" required>
          </div>
          <button type="submit">发送验证码</button>
        </form>
        <p class="auth-switch">记起密码了？<a href="{{ url_for('login') }}">去登录</a></p>
        <p class="auth-switch">已有验证码？<a href="{{ url_for('reset_password') }}">重设密码</a></p>
      </section>
    </div>
  </main>
</body>
</html>
