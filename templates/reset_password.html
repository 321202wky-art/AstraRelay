<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重设密码 | AI 群聊记忆系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="light-page">
  <main class="login-shell">
    <div class="auth-layout">
      <section class="auth-showcase" aria-label="账户安全">
        <div class="auth-stars" aria-hidden="true"></div>
        <div class="auth-nebula" aria-hidden="true"></div>
        <div class="auth-showcase-content">
          <a class="showcase-brand" href="/" aria-label="返回首页"><span class="showcase-mark" aria-hidden="true">N</span>NOVA WORKSPACE</a>
          <div class="showcase-copy">
            <p class="login-kicker">账户安全</p>
            <h2>设置新的<br>登录密码。</h2>
            <p>重设成功后，当前账号的既有登录会话将自动失效。</p>
          </div>
        </div>
      </section>
      <section class="login-card" aria-labelledby="reset-password-title">
        <div class="login-brand" aria-label="AI 群聊记忆系统"><span class="brand-mark" aria-hidden="true">AI</span><span>AI 群聊记忆系统</span></div>
        <header>
          <p class="login-kicker">密码找回</p>
          <h1 id="reset-password-title">重设密码</h1>
          <p class="login-copy">填写邮箱、六位验证码和 9 至 12 位新密码。</p>
        </header>
        {% if error %}<p class="login-alert" role="alert">{{ error }}</p>{% endif %}
        <form class="login-form" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="form-field">
            <label for="email">邮箱</label>
            <input id="email" type="email" name="email" autocomplete="email" required>
          </div>
          <div class="code-send-row">
            <button id="send-reset-code" type="button">发送验证码</button>
            <p id="reset-code-status" class="login-notice" aria-live="polite" hidden></p>
          </div>
          <div class="form-field">
            <label for="code">六位验证码</label>
            <input class="verification-code" id="code" type="text" name="code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required>
          </div>
          <div class="form-field">
            <label for="password">新密码</label>
            <input id="password" type="password" name="password" autocomplete="new-password" required>
          </div>
          <div class="form-field">
            <label for="password_confirm">确认新密码</label>
            <input id="password_confirm" type="password" name="password_confirm" autocomplete="new-password" required>
          </div>
          <button type="submit">重设密码</button>
        </form>
        <p class="auth-switch">还没有验证码？<a href="{{ url_for('forgot_password') }}">重新发送</a></p>
        <p class="auth-switch">返回<a href="{{ url_for('login') }}">登录</a></p>
      </section>
    </div>
  </main>
  <script src="{{ url_for('static', filename='reset_password.js') }}" defer></script>
</body>
</html>
