<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>创建账号 | AI 群聊记忆系统</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body class="light-page">
  <main class="login-shell">
    <div class="auth-layout">
      <section class="auth-showcase" aria-label="平台介绍">
        <div class="auth-stars" aria-hidden="true"></div>
        <div class="auth-nebula" aria-hidden="true"></div>
        <div class="auth-showcase-content">
          <a class="showcase-brand" href="/" aria-label="返回首页"><span class="showcase-mark" aria-hidden="true">N</span>NOVA WORKSPACE</a>
          <div class="showcase-copy">
            <p class="login-kicker">多智能体协作平台</p>
            <h2>创建你的<br>协作空间。</h2>
            <p>注册后即可使用多智能体协作工作台，建立属于你的长期对话空间。</p>
          </div>
          <div class="showcase-stats" aria-label="平台能力">
            <span><strong>5+</strong>协作模型</span>
            <span><strong>实时</strong>流式响应</span>
          </div>
        </div>
      </section>

      <section class="login-card" aria-labelledby="register-title">
        <div class="login-brand" aria-label="AI 群聊记忆系统">
          <span class="brand-mark" aria-hidden="true">AI</span>
          <span>AI 群聊记忆系统</span>
        </div>
        <header>
          <p class="login-kicker">智能协作中心</p>
          <h1 id="register-title">创建账号</h1>
          <p class="login-copy">注册后即可进入多智能体协作工作台</p>
        </header>

        {% if error %}
        <p class="login-alert" role="alert">{{ error }}</p>
        {% endif %}

        <form class="login-form" method="post">
          <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
          <div class="form-field">
            <label for="email">邮箱</label>
            <input id="email" type="email" name="email" autocomplete="email" required>
          </div>
          <div class="form-field">
            <label for="password">密码</label>
            <input id="password" type="password" name="password" autocomplete="new-password" required>
          </div>
          <div class="form-field">
            <label for="password_confirm">确认密码</label>
            <input id="password_confirm" type="password" name="password_confirm" autocomplete="new-password" required>
          </div>
          <button type="submit">发送验证码</button>
        </form>
        <p class="auth-switch">已有账号？<a href="{{ url_for('login') }}">去登录</a></p>
      </section>
    </div>
  </main>
</body>
</html>
